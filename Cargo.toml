[package]
name = "deep_alchemy"
version = "0.1.0"
edition = "2021"
default-run = "deep_alchemy"

[dependencies]
bevy = { version = "0.15.3", default-features = true }
avian3d = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
