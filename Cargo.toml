[package]
name = "deep_alchemy"
version = "0.1.3"
edition = "2021"
default-run = "deep_alchemy"

[lib]
name = "deep_alchemy"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.15.3", default-features = true, features = ["wav"] }
avian3d = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[package.metadata.android]
package = "com.ifpf.vitriol"
label = "Vitriol"
version_code = 4
version_name = "0.1.3"
min_sdk_version = 26
target_sdk_version = 35
orientation = "sensorLandscape"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
assets = "assets"

[package.metadata.android.application]
has_code = false
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.version"
version = 0x400003
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
