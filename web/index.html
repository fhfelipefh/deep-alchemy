<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <base href="./">
    <link rel="icon" href="assets/icons/app_icon.ico">
    <title>Vitriol — Deep Alchemy</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; background: #000; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="vitriol-canvas" tabindex="0" aria-label="Vitriol — jogo 3D"></canvas>
    <script type="module">
      import startGame from './pkg/deep_alchemy.js';

      const audioContexts = new Set();
      const gameCanvas = document.getElementById('vitriol-canvas');
      const gameKeys = new Set([
        'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyC',
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'Space', 'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight',
        'Escape', 'Enter', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'F11',
      ]);

      gameCanvas.addEventListener('pointerdown', () => gameCanvas.focus());
      window.addEventListener('keydown', (event) => {
        if (document.activeElement !== gameCanvas) return;

        // Keep game controls from scrolling the page or invoking browser shortcuts
        // (for example Ctrl+W/Ctrl+R while Ctrl is held for crouching).
        if (gameKeys.has(event.code) || event.ctrlKey || event.altKey || event.metaKey) {
          event.preventDefault();
        }
      }, true);

      const AudioContextConstructor = window.AudioContext;

      if (AudioContextConstructor) {
        window.AudioContext = new Proxy(AudioContextConstructor, {
          construct(target, args, newTarget) {
            const context = Reflect.construct(target, args, newTarget);
            audioContexts.add(context);
            return context;
          },
        });

        const resumeGameAudio = () => {
          for (const context of audioContexts) {
            if (context.state === 'suspended') context.resume().catch(() => {});
          }
        };

        window.addEventListener('pointerdown', resumeGameAudio, true);
        window.addEventListener('keydown', resumeGameAudio, true);
      }

      startGame().catch((reason) => {
        const message = String(reason?.message ?? reason);
        if (!message.startsWith("Using exceptions for control flow, don't mind me.")) {
          console.error('Não foi possível iniciar Vitriol Web.', reason);
        }
      });
    </script>
  </body>
</html>
