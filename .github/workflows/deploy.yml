name: Build and deploy Vitriol Web

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build WebAssembly game
        run: cargo build --release --bin deep_alchemy --target wasm32-unknown-unknown

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          mkdir -p dist/pkg
          cp web/index.html dist/index.html
          mkdir -p dist/assets
          cp -R assets/audio assets/data assets/fonts assets/icons assets/shaders assets/textures dist/assets/
          mkdir -p dist/assets/models
          cp assets/models/*.glb dist/assets/models/
          wasm-bindgen --target web --out-dir dist/pkg --out-name deep_alchemy target/wasm32-unknown-unknown/release/deep_alchemy.wasm
          printf 'Vitriol Web %s\n' "${GITHUB_SHA}" > dist/version.txt

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
