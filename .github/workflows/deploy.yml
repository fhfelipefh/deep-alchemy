name: Build and deploy Vitriol Web

on:
  push:
    branches:
      - master
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  remove-older-releases:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove previously published releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api --paginate "repos/${REPOSITORY}/releases" --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id tag_name; do
            if [[ -n "$release_id" && "$tag_name" != "$CURRENT_TAG" ]]; then
              echo "Removing old release $tag_name (ID $release_id)"
              gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}"
            fi
          done

  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install WebAssembly optimizer
        run: npm install --global binaryen@132.0.0

      - name: Build WebAssembly game
        run: cargo build --release --bin deep_alchemy --target wasm32-unknown-unknown

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          mkdir -p dist/pkg
          cp web/index.html dist/index.html
          mkdir -p dist/assets
          cp -R assets/audio assets/data assets/fonts assets/icons assets/shaders assets/textures dist/assets/
          mkdir -p dist/assets/models
          cp assets/models/*.glb dist/assets/models/
          wasm-bindgen --target web --out-dir dist/pkg --out-name deep_alchemy target/wasm32-unknown-unknown/release/deep_alchemy.wasm
          wasm_path=dist/pkg/deep_alchemy_bg.wasm
          original_bytes=$(stat -c%s "$wasm_path")
          wasm-opt -Oz "$wasm_path" -o "$wasm_path.optimized"
          optimized_bytes=$(stat -c%s "$wasm_path.optimized")
          if (( optimized_bytes >= original_bytes )); then
            echo "Web performance regression: wasm-opt did not reduce the WASM payload (${original_bytes} -> ${optimized_bytes} bytes)."
            exit 1
          fi
          mv "$wasm_path.optimized" "$wasm_path"
          reduction=$((100 * (original_bytes - optimized_bytes) / original_bytes))
          echo "Web payload benchmark: WASM reduced from ${original_bytes} to ${optimized_bytes} bytes (${reduction}% smaller)."
          printf 'Vitriol Web %s\n' "${GITHUB_SHA}" > dist/version.txt

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
